<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15100B">
<title>Escalations desk</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<style>
@font-face{font-family:"Bodoni Moda";src:url(/fonts/BodoniModa-normal.woff2) format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(/fonts/HankenGrotesk-normal.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{--walnut:#15100B;--walnut-2:#1E1710;--walnut-3:#2A2017;--rule:#4A3B2B;--cream:#F3EBDA;--brass:#CDB991;--brass-dim:#9C8B6C;--amber:#F6A828;--amber-deep:#C97E0B;--ink:#1B140D;--ok:#8FBF7F;--bad:#E08A6B;
--serif:"Bodoni Moda","Didot",Georgia,serif;--sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--walnut);color:var(--cream);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;accent-color:var(--amber)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.btn{background:var(--amber);color:var(--ink);border:0;border-radius:999px;padding:9px 20px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn--ghost{background:transparent;color:var(--cream);border:1px solid var(--rule)}
.btn--ghost:hover{border-color:var(--brass)}
.btn--sm{padding:5px 13px;font-size:13px}
.field{width:100%;background:var(--walnut-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.field:focus{border-color:var(--amber);outline:none}
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login div{width:min(420px,100%);display:grid;gap:14px}
.login h1{font:700 28px var(--serif);margin:0}
.login p{margin:0;color:var(--brass)}
.login a{color:var(--amber)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--walnut-2);flex-wrap:wrap}
.bar h1{font:700 19px var(--serif);margin:0 8px 0 0}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--brass);font-weight:600}
.tab[aria-selected=true]{background:var(--amber);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:var(--ink);font-size:12px;font-weight:700;text-align:center}
.tab[aria-selected=true] .badge{background:var(--ink);color:var(--amber)}
.bar .sp{flex:1}
.bar a{color:var(--brass);font-size:13px}
.panes{display:grid;grid-template-columns:minmax(280px,380px) 1fr;min-height:0}
.list{border-right:1px solid var(--rule);overflow:auto;min-height:0}
.filters{display:flex;gap:8px;padding:10px 12px;position:sticky;top:0;background:var(--walnut);border-bottom:1px solid var(--rule);z-index:1}
.filters .field{padding:7px 10px}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 14px;cursor:pointer}
.row:hover{background:var(--walnut-2)}
.row[aria-current=true]{background:var(--walnut-3);box-shadow:inset 3px 0 var(--amber)}
.row__top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--brass-dim)}
.row__who{font-weight:700;color:var(--cream);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__sub{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__pre{font-size:13px;color:var(--brass-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);color:var(--brass)}
.pill--open{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.pill--answered,.pill--ok{border-color:var(--ok);color:var(--ok)}
.pill--esc{border-color:var(--amber);color:var(--amber)}
.pill--bad{border-color:var(--bad);color:var(--bad)}
.empty{padding:28px 18px;color:var(--brass-dim)}
.view{overflow:auto;min-height:0;padding:20px clamp(16px,3vw,36px) 40px}
.view__head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.view__head h2{font:700 22px/1.25 var(--serif);margin:0 0 4px}
.meta{color:var(--brass);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:none}
.msg{max-width:760px;margin:0 0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--walnut-2)}
.msg--owner{margin-left:auto;border-color:var(--amber-deep);background:#2A1E0C}
.msg--bot{background:var(--walnut)}
.msg__h{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--brass-dim)}
.msg__h b{color:var(--cream);letter-spacing:.04em;text-transform:uppercase}
.msg__b{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.atts{display:grid;gap:6px;padding:0 14px 12px;font-size:13px}
.atts a{color:var(--brass)}
.note{padding:12px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--walnut-2);margin:16px 0;color:var(--brass);max-width:760px}
.composer{max-width:760px;margin-top:22px;border-top:1px solid var(--rule);padding-top:18px;display:grid;gap:12px}
.composer h3{margin:0;font:700 17px var(--serif)}
.composer textarea{min-height:170px;resize:vertical}
.send{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--brass-dim);margin:0}
@media(max-width:820px){
 .panes{grid-template-columns:1fr}
 .list{border-right:0}
 .app[data-open=true] .list{display:none}
 .app:not([data-open=true]) .view{display:none}
 .back{display:inline-flex}
}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <div>
    <h1>Escalations desk</h1>
    <p id="loginMsg">Sign in as an admin first.</p>
    <p><a href="https://merchant.placemyorder.online/">Sign in at merchant.placemyorder.online</a> with an admin email, then come back here.</p>
  </div>
</section>

<div class="app" id="app" hidden>
  <header class="bar">
    <h1>Escalations desk</h1>
    <div class="tabs" role="tablist" aria-label="Desk">
      <button class="tab" role="tab" id="tab-esc" aria-selected="true" data-tab="esc">Escalations<span class="badge" id="openCount" hidden>0</span></button>
      <button class="tab" role="tab" id="tab-all" aria-selected="false" data-tab="all">Support chains</button>
    </div>
    <span class="sp"></span>
    <a href="/">Dashboard</a>
    <button class="btn btn--ghost btn--sm" id="refresh" type="button">Refresh</button>
  </header>
  <div class="panes">
    <aside class="list" aria-label="Email chains">
      <div class="filters">
        <input class="field" id="q" type="search" placeholder="Search" aria-label="Search chains">
        <select class="field" id="statusFilter" aria-label="Status" style="max-width:130px">
          <option value="active">To do</option><option value="all">All</option><option value="open">Open</option><option value="answered">Answered</option><option value="done">Done</option>
        </select>
      </div>
      <div id="rows" role="list"></div>
    </aside>
    <main class="view" id="view"><p class="empty">Choose a chain.</p></main>
  </div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var state={tab:"esc",threads:[],cur:null,thread:null};
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function when(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function call(method,path,body){
  return fetch("/api/admin/desk"+(path||""),{method:method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401||r.status===403){showLogin(r.status===403?"This account isn’t an admin.":"Sign in as an admin first.");throw new Error("auth")}
      if(!r.ok)throw new Error(j.error||"Something went wrong.");return j})});
}
function showLogin(msg){$("app").hidden=true;$("login").hidden=false;$("loginMsg").textContent=msg}
var WORDS={merchant:"Merchant",bot:"Assistant",owner:"You"};
function pill(text,cls){return el("span","pill"+(cls?" pill--"+cls:""),text)}
function scanPill(f){var s=f.status;return s==="clean"?pill("virus-free","ok"):s==="flagged"?pill("FLAGGED - do not open","bad"):pill({unscanned:"not scanned",error:"scan failed",toolarge:"too large"}[s]||s)}

function loadList(){
  var f=state.tab==="esc"?"active":$("statusFilter").value;
  return call("GET","?f="+encodeURIComponent(f)).then(function(rows){
    state.threads=rows;var open=rows.filter(function(t){return t.escalated&&t.status==="open"}).length;
    $("openCount").textContent=open;$("openCount").hidden=!open;drawList();
  }).catch(function(e){if(e.message!=="auth")$("rows").replaceChildren(el("p","empty",e.message))});
}
function drawList(){
  var q=$("q").value.trim().toLowerCase(),box=$("rows");box.replaceChildren();
  var rows=state.threads.filter(function(t){return state.tab==="esc"?t.escalated:true}).filter(function(t){return !q||(t.email+" "+(t.name||"")+" "+t.subject+" "+(t.preview||"")).toLowerCase().indexOf(q)>=0});
  if(!rows.length){box.append(el("p","empty",state.tab==="esc"?"Nothing escalated. All clear.":"No chains yet."));return}
  rows.forEach(function(t){
    var b=el("button","row");b.type="button";b.setAttribute("role","listitem");if(t.id===state.cur)b.setAttribute("aria-current","true");
    var top=el("div","row__top");top.append(el("span","row__who",t.name?t.name+" · "+t.email:t.email),el("span",null,when(t.updated_at)));
    var pills=el("div");pills.style.margin="3px 0";pills.append(pill(t.status,t.status==="open"?"open":t.status==="answered"?"answered":""));if(t.escalated){pills.append(" ",pill("escalated","esc"))}
    b.append(top,el("div","row__sub",t.subject),pills,el("div","row__pre",(t.preview||"").replace(/\s+/g," ")));
    b.onclick=function(){open(t.id)};box.append(b);
  });
}
function open(id){
  state.cur=id;$("app").dataset.open="true";drawList();
  call("GET","/"+id).then(function(t){state.thread=t;drawThread()}).catch(function(e){if(e.message!=="auth")$("view").replaceChildren(el("p","empty",e.message))});
}
function drawThread(){
  var t=state.thread,v=$("view");v.replaceChildren();
  var head=el("div","view__head"),l=el("div"),back=el("button","btn btn--ghost btn--sm back","‹ Back");back.type="button";back.onclick=function(){$("app").dataset.open="false"};
  l.append(back,el("h2",null,t.subject));
  var meta=el("div","meta");meta.append(el("span",null,(t.name?t.name+" · ":"")+t.email),pill(t.status,t.status==="open"?"open":t.status==="answered"?"answered":""));if(t.escalated)meta.append(pill("escalated","esc"));l.append(meta);
  var act=el("div","send"),done=el("button","btn btn--ghost btn--sm",t.status==="done"?"Reopen":"Mark done");done.type="button";
  done.onclick=function(){call("POST","/"+t.id+"/status",{status:t.status==="done"?"open":"done"}).then(function(){open(t.id);loadList()})};act.append(done);
  head.append(l,act);v.append(head);
  if(t.reason)v.append(el("div","note","Escalated: "+t.reason));
  t.msgs.forEach(function(m){
    var box=el("div","msg msg--"+m.by),h=el("div","msg__h");h.append(el("b",null,WORDS[m.by]||m.by),el("span",null,when(m.created_at)));
    box.append(h,el("div","msg__b",m.body));
    if(m.files&&m.files.length){var a=el("div","atts");m.files.forEach(function(f){var r=el("div");r.append(el("span",null,f.name+" "),scanPill(f));if(f.link){var x=el("a",null," VirusTotal");x.href=f.link;x.target="_blank";x.rel="noopener noreferrer";r.append(x)}a.append(r)});a.append(el("span","hint","Files are scanned and never stored or opened here."));box.append(a)}
    v.append(box);
  });
  var c=el("div","composer");c.append(el("h3",null,"Reply to "+(t.name||t.email)));
  var ta=el("textarea","field");ta.placeholder="Write your reply. It is sent from merchantsupport@placemyorder.online in the Docket email design.";c.append(ta);
  var s=el("div","send"),b=el("button","btn","Send reply");b.type="button";s.append(b,el("span","hint","Your reply marks the chain as answered."));c.append(s);
  b.onclick=function(){var text=ta.value.trim();if(!text)return;b.disabled=true;b.textContent="Sending…";
    call("POST","/"+t.id+"/reply",{text:text}).then(function(){open(t.id);loadList()}).catch(function(e){b.disabled=false;b.textContent="Send reply";alert(e.message)})};
  v.append(c);v.scrollTop=0;
}
function start(){$("login").hidden=true;$("app").hidden=false;loadList().then(function(){var p=new URLSearchParams(location.search).get("t");if(p&&/^[a-f0-9]{16}$/.test(p))open(p)})}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});$("statusFilter").hidden=state.tab==="esc";loadList()}});
$("q").oninput=drawList;$("statusFilter").onchange=loadList;$("refresh").onclick=function(){loadList();if(state.cur)open(state.cur)};
$("statusFilter").hidden=true;
setInterval(function(){if(!$("app").hidden)loadList()},60000);
call("GET","?f=active").then(start).catch(function(e){if(e.message!=="auth")showLogin(e.message)});
})();
</script>
</body>
</html>
